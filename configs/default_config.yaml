# ==============================================================================
# Chess Game Recording System - Default Configuration
# Corresponds to mathematical parameters in Explanatory Note (Sections 2.4.1 - 2.4.8)
# ==============================================================================

vision:
  target_board_size: 640          # Normalized board size in pixels (640x640)
  min_camera_angle: 50.0          # Minimum camera angle in degrees relative to board
  parallax_height_alpha: 1.25     # Vertical crop expansion factor for tall pieces
  min_board_area_ratio: 0.15      # Minimum board area ratio relative to frame (15%)
  yolo_board_confidence: 0.50     # YOLO corner detector confidence threshold
  classifier_batch_size: 64       # Batch size for 64-cell neural inference
  threshold_occupied: 0.60        # tau_o: Occupancy probability threshold
  threshold_color: 0.70           # tau_c: Piece color classification threshold
  threshold_piece: 0.65           # tau_t: Piece type classification threshold

  localizer:
    mode: "coarse_to_fine"        # "coarse_to_fine" | "pure_hough" | "manual" | "aruco"
    yolo_model_path: "data/weights/yolov8n_board.pt"
    yolo_confidence: 0.40
    canny_low_threshold: 50
    canny_high_threshold: 150
    hough_threshold: 80
    hough_min_line_length: 100
    hough_max_line_gap: 20
    subpixel_win_size: 11
    max_reprojection_error_px: 2.5

  orientation:
    color_check_enabled: true
    mass_distribution_enabled: true
    fallback_orientation: "unknown"  # "unknown" | "white_bottom" | "black_bottom"

  hand_detector:
    enabled: true
    min_detection_confidence: 0.60
    min_tracking_confidence: 0.50
    dilation_margin_px: 18        # Expansion margin for hand shadow coverage
    occlusion_threshold: 0.15     # Square occlusion ratio to trigger occluded=True


temporal:
  settling_time_sec: 0.8          # Delta t_settle: Debounce settling window in seconds
  motion_diff_threshold: 0.04     # tau_motion: Pixel change ratio to enter MOVING
  verifying_stable_frames: 8      # N_verify: Consecutive stable frames to confirm state
  pixel_diff_threshold: 25        # tau_diff: Sensitivity threshold for pixel delta (0..255)
  motion_ema_alpha: 0.35          # Temporal smoothing alpha for motion score


decision:
  weight_visual: 0.50             # w_v: Visual classification likelihood weight
  weight_temporal: 0.25           # w_t: Temporal stability weight
  weight_geometry: 0.15           # w_g: Homography quality weight
  weight_occlusion: 0.10          # w_o: Occlusion penalty weight
  min_confidence_margin: 0.15     # Delta: Minimum score margin S(m1) - S(m2)

analysis:
  stockfish_enabled: true
  stockfish_depth: 15             # Engine search depth
  stockfish_path: null            # Path to Stockfish executable (null = auto-discover)
  blunder_threshold_cp: 150       # Blunder threshold in centipawns (150 = 1.5 pawns)

camera:
  source_type: "synthetic"        # 'synthetic', 'file', 'device', 'rtsp'
  source_path: ""                 # Video path, webcam index or PGN path
  fps: 30.0                       # Frame rate
  width: 1920                     # Resolution width
  height: 1080                    # Resolution height
  rotate: 0                       # Orientation degrees: 0, 90, 180, 270

labeller:
  output_dir: "data/dataset"
  target_crop_size: [112, 112]
  max_samples_per_move: 64
  save_format: "png"

piece_classifier:
  enabled: true
  model_path: "models/piece_classifier.onnx"
  architecture: "chesscog"
  backend: "auto"
  batch_size: 64
  input_size: [112, 112]
  occupancy_threshold: 0.50
  confidence_threshold: 0.60
  device: "cpu"

training:
  dataset_dir: "data/dataset"
  output_dir: "models/checkpoints"
  architecture: "efficientnet_b0"
  batch_size: 32
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 5
  val_split_ratio: 0.15
  test_split_ratio: 0.15
  seed: 42
  experiment_name: "chess_piece_classification"


